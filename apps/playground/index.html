<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Loaders Playground</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    h1 { font-size: 20px; }
    h2 { font-size: 14px; color: #666; margin: 20px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .cell { background: #fff; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .label { font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <h1>CSS Loaders Playground</h1>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
