<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Loaders</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-elev: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --text-dim: #656d76;
      --accent: #0969da;
    }
    [data-theme="dark"] {
      --bg: #0d1117;
      --bg-elev: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background .2s, color .2s;
    }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .topbar h1 { font-size: 18px; font-weight: 700; }
    .topbar a { color: var(--accent); text-decoration: none; font-size: 13px; }
    .search {
      flex: 1; max-width: 360px;
      padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elev); color: var(--text);
      font-size: 14px; outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .theme-btn {
      margin-left: auto;
      padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elev); color: var(--text);
      cursor: pointer; font-size: 13px;
    }
    .nav {
      position: sticky; top: 53px; z-index: 9;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 8px 24px;
      display: flex; flex-wrap: wrap; gap: 6px;
      overflow-x: auto;
    }
    .nav a {
      color: var(--text-dim); text-decoration: none; font-size: 12px;
      padding: 3px 10px; border-radius: 99px;
      background: var(--bg-elev);
      white-space: nowrap;
    }
    .nav a:hover { color: var(--accent); }
    main { padding: 24px; max-width: 1400px; margin: 0 auto; }
    h2 {
      font-size: 15px; font-weight: 600;
      margin: 32px 0 12px;
      color: var(--text);
    }
    h2 .count { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .cell {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px;
      min-height: 120px;
      transition: border-color .15s;
    }
    .stage {
      width: 190px; height: 80px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      --size: 24px;
    }
    .cell:hover { border-color: var(--accent); }
    .name { font-size: 10px; color: var(--text-dim); font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>CSS Loaders</h1>
    <input class="search" id="search" placeholder="搜索 loader，如 line-1" />
    <button class="theme-btn" id="theme-toggle">🌙</button>
  </header>
  <nav class="nav" id="nav"></nav>
  <main id="app"></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
