<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Loaders</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 { font-size: 28px; font-weight: 700; color: #f0f6fc; }
    .subtitle { color: #8b949e; font-size: 14px; margin: 4px 0 24px; }
    .subtitle a { color: #58a6ff; }
    .nav {
      position: sticky; top: 0; background: #0d1117;
      padding: 12px 0; margin-bottom: 24px;
      border-bottom: 1px solid #21262d;
      display: flex; flex-wrap: wrap; gap: 6px; z-index: 10;
    }
    .nav a {
      color: #58a6ff; text-decoration: none; font-size: 12px;
      padding: 3px 8px; border-radius: 6px; background: #161b22;
    }
    .nav a:hover { background: #21262d; }
    h2 {
      font-size: 15px; font-weight: 600; color: #f0f6fc;
      margin: 32px 0 12px; padding-bottom: 8px;
      border-bottom: 1px solid #21262d;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .cell {
      background: #161b22; border: 1px solid #21262d;
      border-radius: 10px; padding: 16px;
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; min-height: 90px; justify-content: center;
      transition: border-color .15s;
    }
    .cell:hover { border-color: #30363d; }
    .stage { display: flex; gap: 18px; align-items: center; justify-content: center; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .label { font-size: 10px; color: #6e7681; }
  </style>
</head>
<body>
  <h1>CSS Loaders</h1>
  <p class="subtitle">707 个纯 CSS loading 动画 · Vue / React 组件 · <a href="https://github.com/xyj2156/css-loaders">GitHub</a></p>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
